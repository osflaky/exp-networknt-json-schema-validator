name: CI

on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - java: 25
          os: macos-latest
          arch: arm64
          runner: macos-latest
          expander_leg: macos-latest-25-arm64
    name: Java ${{ matrix.java }} [${{ matrix.expander_leg }}]
    steps:
    - uses: actions/checkout@v4

    - name: Setup JDK
      uses: actions/setup-java@v4
      with:
        distribution: ${{ matrix.distribution || 'temurin' }}
        java-version: ${{ matrix.java }}
        cache: 'maven'

    - name: Build with Maven
      run: mvn --batch-mode --update-snapshots verify "-Dstyle.color=always"

    - name: Upload coverage to Codecov
      if: matrix.java == '8'
      uses: codecov/codecov-action@v4
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        fail_ci_if_error: false
    timeout-minutes: 150
